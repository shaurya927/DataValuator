services:
  backend:
    build:
      context: .
      target: backend
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - CORS_ORIGINS=http://localhost
      - API_KEY=${API_KEY:-}
    volumes:
      - dataval-data:/app/backend/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: production
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  dataval-data:
